[package]
name = "xmlpoc"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
quick-xml = "0.31"
csv = "1.3"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-secretsmanager = "1"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde","clock"] }
chrono-tz = "0.10"
anyhow = "1"
aws-sdk-lambda = "1"
aws-sdk-glue = "1"
serde_json = "1"
dotenvy = "0.15"
sqlx = {version = "0.8",features = ["runtime-tokio-rustls", "chrono", "postgres"] }